<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <form action="proses.html" method="post">
        <label for="exampleFormControlInput1">Nama</label><input type="text" name="nama" id=""><br>
        <label for="">Tempat Lahir</label><input type="text" name="tmpt_lahir" id=""><br>
        <label for="">Tanggal Lahir</label><input type="date" name="tgl_lahir" id=""><br>

        <p>hobi (bisa lebih dari 1 pilihan)</p>
        <label for="">berenang</label><input type="checkbox" name="hobi[]" id="" value="berenang">
        <label for="">membaca</label><input type="checkbox" name="hobi[]" id="" value="membaca">
        <label for="">melukis</label><input type="checkbox" name="hobi[]" id="" value="melukis">
        <br>
        <p>jenis kelamin</p>
        <label for="">Laki-laki</label><input type="radio" name="jk" id="" value="L">
        <label for="">Perempuan</label><input type="radio" name="jk" id="" value="P">
        <p>Deskripsikan tentang kamu</p>
        <textarea name="deskripsi" id=""></textarea>

        <select name="agama" id="">
            <option value="1">Islam</option>
            <option value="2">Kristen</option>
            <option value="3">Katolik</option>
            <option value="4">Hindu</option>
            <option value="5">Budha</option>
        </select>
        <input type="submit" value="simpan">
    </form>
    <div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon1">@</span>
  <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
</div>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Recipient’s username" aria-label="Recipient’s username" aria-describedby="basic-addon2">
  <span class="input-group-text" id="basic-addon2">@example.com</span>
</div>

<div class="mb-3">
  <label for="basic-url" class="form-label">Your vanity URL</label>
  <div class="input-group">
    <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
    <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
  </div>
  <div class="form-text" id="basic-addon4">Example help text goes outside the input group.</div>
</div>

<div class="input-group mb-3">
  <span class="input-group-text">$</span>
  <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
  <span class="input-group-text">.00</span>
</div>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Username" aria-label="Username">
  <span class="input-group-text">@</span>
  <input type="text" class="form-control" placeholder="Server" aria-label="Server">
</div>

<div class="input-group">
  <span class="input-group-text">With textarea</span>
  <textarea class="form-control" aria-label="With textarea"></textarea>
</div>
</body>
</html>
